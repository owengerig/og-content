# Keeps the manifests (file hashes + versions: manifest.json for shared content, games/<game>/manifest.json per
# game) and versions.json up to date: after every push that changes content, it rebuilds them, bumps the patch
# version of each manifest whose files changed and commits them. Apps only download what changed.
name: Build manifest

on:
  push:
    branches: [main]
    paths-ignore: ["manifest.json", "versions.json", "games/*/manifest.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the color themes (contrast, look-alikes, color blindness)
        run: python3 tools/themes.py check
      - run: python3 tools/build_manifest.py
      - name: Commit the manifests
        run: |
          git add manifest.json versions.json games/*/manifest.json
          if git diff --cached --quiet; then echo "manifests unchanged"; exit 0; fi
          git config user.name "og-content-bot"
          git config user.email "og-content-bot@users.noreply.github.com"
          git commit -m "Update manifests: $(python3 -c "import json;v=json.load(open('versions.json'));print('shared', v['shared'], ' '.join(k+' '+x for k,x in v['games'].items()))")"
          git push
